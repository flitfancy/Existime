[platformio]
default_envs = esp32s3_n16r8_usb

[env:esp32s3_n16r8_usb]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino

lib_deps =
    h2zero/NimBLE-Arduino@2.5.0
    adafruit/Adafruit AS7341@1.4.1
    adafruit/Adafruit LTR390 Library@1.1.2
    adafruit/Adafruit BMP3XX Library@2.1.6
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit GFX Library@1.12.6
    olikraus/U8g2_for_Adafruit_GFX@1.8.0
    sensirion/Sensirion Core@0.7.3
    sensirion/Sensirion I2C SGP41@1.0.0
    sensirion/Sensirion Gas Index Algorithm@3.2.3
    sensirion/Sensirion I2C SCD4x@1.1.0

; The validated N16R8 board uses the ESP32-S3 native USB port.
upload_protocol = esptool
monitor_speed = 115200
monitor_filters = direct
upload_speed = 460800

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -Wl,--undefined=ffs_ota_device_marker
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

; Bench build for a sensor module wired directly to GPIO1(SDA)/GPIO2(SCL).
; Flash with: platformio run -e esp32s3_bench -t upload
[env:esp32s3_bench]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino

lib_deps =
    h2zero/NimBLE-Arduino@2.5.0
    adafruit/Adafruit AS7341@1.4.1
    adafruit/Adafruit LTR390 Library@1.1.2
    adafruit/Adafruit BMP3XX Library@2.1.6
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit GFX Library@1.12.6
    olikraus/U8g2_for_Adafruit_GFX@1.8.0
    sensirion/Sensirion Core@0.7.3
    sensirion/Sensirion I2C SGP41@1.0.0
    sensirion/Sensirion Gas Index Algorithm@3.2.3
    sensirion/Sensirion I2C SCD4x@1.1.0

upload_protocol = esptool
monitor_speed = 115200
monitor_filters = direct
upload_speed = 460800

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -Wl,--undefined=ffs_ota_device_marker
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DBENCH_SDA=1
    -DBENCH_SCL=2
